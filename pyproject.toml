[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raceresult"
version = "0.1.0"
description = "Python API client for Raceresult"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Valerius" }
]
keywords = ["raceresult", "api", "timing", "race", "sports"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.13.4",
    "eval_type_backport>=0.1.3;python_version<'3.10'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.16.2",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/Karlsruher-Lemminge/py-raceresult"
Repository = "https://github.com/Karlsruher-Lemminge/py-raceresult"

[tool.hatch.build.targets.wheel]
packages = ["src/raceresult"]

[tool.hatch.build.targets.wheel.force-include]
"src/raceresult/py.typed" = "raceresult/py.typed"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
# Pydantic Field(...) declarations run long; 110 keeps them on one line.
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The manual_* scripts intentionally adjust sys.path before importing.
"tests/manual_*.py" = ["E402"]

[tool.mypy]
python_version = "3.9"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# The manual_* scripts are throwaway smoke-test drivers, not library code.
module = "tests.*"
ignore_errors = true
