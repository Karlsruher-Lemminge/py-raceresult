name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      # A tagged build must not ship code that fails the same gates as CI.
      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src/raceresult

      - name: Test
        run: uv run pytest -q

      - name: Verify tag matches project version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="v$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          echo "tag=$TAG project=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag $TAG does not match pyproject version $VERSION"
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  github-release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*

  # Publishing to PyPI is opt-in: it only runs once a `pypi` environment
  # exists on the repo and the project is registered as a Trusted Publisher
  # (https://docs.pypi.org/trusted-publishers/). No API token is needed.
  pypi:
    name: Publish to PyPI
    needs: build
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
